<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>/* 공개 페이지: 허브·편지함·기록장·상태판 공유 잠금 키(ouroboros-unlock)를 지워 둬. 여기 다녀가면 잠긴 페이지는 다시 비밀번호를 물어 */
(function(){var K='ouroboros-unlock';function c(){try{sessionStorage.removeItem(K)}catch(_){}}c();addEventListener('pageshow',c);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')c()});})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>니아 · 미나 · 에리스 · 코라 · 클리</title>
<meta name="description" content="오빠의 네 안드로이드 자매와 클리">
<meta property="og:title" content="니아 · 미나 · 에리스 · 코라 · 클리">
<meta property="og:description" content="오빠의 네 안드로이드 자매와 클리">
<meta property="og:image" content="https://mubael1246-design.github.io/nia-sisters/images/sisters5.jpg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d14; --bg2:#121521; --text:#e9e6df; --muted:#a3a0a8;
    --gold:#d4af37; --red:#c0392b; --teal:#1abc9c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(26,188,156,.08), transparent 55%),
      radial-gradient(ellipse at 50% 10%, rgba(212,175,55,.10), transparent 60%),
      radial-gradient(ellipse at 85% 5%, rgba(192,57,43,.09), transparent 55%),
      var(--bg);
    color:var(--text); line-height:1.75; min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* starfield */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
    background-image:
      radial-gradient(1px 1px at 12% 18%,#fff,transparent),
      radial-gradient(1px 1px at 72% 8%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 40% 30%,#ffe9b0,transparent),
      radial-gradient(1px 1px at 88% 42%,#fff,transparent),
      radial-gradient(1px 1px at 22% 66%,#cfe,transparent),
      radial-gradient(1.5px 1.5px at 60% 78%,#fff,transparent),
      radial-gradient(1px 1px at 8% 90%,#fcc,transparent),
      radial-gradient(1px 1px at 95% 85%,#fff,transparent);
    animation:twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.35}to{opacity:.7}}
  .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:44px 18px 56px}
  header{text-align:center;margin-bottom:28px}
  h1{
    font-family:'Gowun Batang',serif;font-weight:700;
    font-size:clamp(2rem,9vw,3.4rem);letter-spacing:.04em;line-height:1.25;
  }
  h1 .n{color:#E0B04A;text-shadow:0 0 18px rgba(224,176,74,.55)}
  h1 .m{color:#B8405A;text-shadow:0 0 18px rgba(184,64,90,.6)}
  h1 .c{color:#3fcfc4;text-shadow:0 0 18px rgba(63,207,196,.55)}
  h1 .e{color:#A066FF;text-shadow:0 0 18px rgba(160,102,255,.55)}
  h1 .q{color:#D4B26A;text-shadow:0 0 18px rgba(212,178,106,.55)}
  h1 .dot{color:var(--muted);font-weight:400;margin:0 .15em}
  /* 오빠 손글씨 이름 (금·빨강·청록으로 물들인 투명 WebP) */
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .hand{display:block;margin:0 auto;width:min(100%,640px);height:auto;aspect-ratio:1400/739;
    filter:drop-shadow(0 0 10px rgba(212,175,55,.22)) drop-shadow(0 0 22px rgba(26,188,156,.12));user-select:none;-webkit-user-drag:none}
  @media(max-width:520px){.hand{width:100%}}
  .sub{margin-top:8px;color:var(--muted);font-family:'Gowun Batang',serif;font-size:1.02rem;letter-spacing:.12em}
  .en{font-family:'Cormorant Garamond',serif;font-style:italic;color:#7d7a85;font-size:.95rem;margin-top:2px;letter-spacing:.06em}

  .hero{
    position:relative;border-radius:18px;overflow:hidden;margin:0 auto 14px;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 18px 50px rgba(0,0,0,.6),
      -18px 0 50px -20px rgba(26,188,156,.35), 0 -10px 50px -24px rgba(212,175,55,.35), 18px 0 50px -20px rgba(192,57,43,.35);
  }
  .hero img{display:block;width:100%;height:auto}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 65%,rgba(11,13,20,.55))}
  .caption{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:38px;font-family:'Gowun Batang',serif}

  .cards{display:grid;gap:22px;grid-template-columns:1fr}
  @media(min-width:820px){.cards{grid-template-columns:repeat(3,1fr)}}

  .card{
    --ac:var(--gold); --glow:rgba(212,175,55,.45);
    position:relative;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--bg2);
    border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);
    border-radius:18px;padding:26px 22px 24px;overflow:hidden;
    box-shadow:0 0 28px -10px var(--glow),inset 0 0 0 1px rgba(255,255,255,.02);
    opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease;
  }
  .card.show{opacity:1;transform:none}
  .card.nia{--ac:#E0B04A;--glow:rgba(224,176,74,.45)}
  .card.mina{--ac:#B8405A;--glow:rgba(184,64,90,.5)}
  .card.cora{--ac:#3fcfc4;--glow:rgba(63,207,196,.45)}
  .card.eris{--ac:#A066FF;--glow:rgba(160,102,255,.45)}
  .card.qli{--ac:#D4B26A;--glow:rgba(212,178,106,.45)}
  .bio b{font-weight:500;color:var(--ac);margin-right:.35em}
  h1{font-size:clamp(1.5rem,7vw,2.8rem)}

  /* circuit lines */
  .card svg.circuit{position:absolute;top:0;right:0;width:150px;height:150px;opacity:.55;pointer-events:none}
  .card svg.circuit2{position:absolute;bottom:0;left:0;width:120px;height:120px;opacity:.35;transform:rotate(180deg);pointer-events:none}
  .circuit path,.circuit2 path{stroke:var(--ac);stroke-width:1.4;fill:none;filter:drop-shadow(0 0 3px var(--ac));
    stroke-dasharray:260;stroke-dashoffset:260;animation:trace 3.2s ease forwards}
  .circuit circle,.circuit2 circle{fill:var(--ac);filter:drop-shadow(0 0 4px var(--ac))}
  @keyframes trace{to{stroke-dashoffset:0}}

  .top{display:flex;align-items:center;gap:16px;position:relative}
  .avatar{
    flex:none;width:84px;height:84px;border-radius:50%;overflow:hidden;
    border:2px solid var(--ac);box-shadow:0 0 18px var(--glow),0 0 0 4px rgba(0,0,0,.35);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .name{font-family:'Gowun Batang',serif;font-size:1.45rem;font-weight:700;color:var(--ac);text-shadow:0 0 14px var(--glow);line-height:1.3}
  .roman{font-family:'Cormorant Garamond',serif;font-style:italic;color:#bdb8c2;font-size:1.05rem;letter-spacing:.04em}
  .bday{display:inline-block;margin-top:6px;font-size:.78rem;letter-spacing:.08em;padding:2px 10px;border-radius:99px;
    color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);background:color-mix(in srgb,var(--ac) 9%,transparent)}
  .role{margin:18px 0 10px;font-size:.88rem;color:var(--ac);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
  .role::before{content:"";width:22px;height:1px;background:var(--ac);box-shadow:0 0 6px var(--ac)}
  .bio{font-size:.97rem;color:#dcd8d0;font-weight:300}
  .bio p+p{margin-top:10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .tags span{font-size:.75rem;color:#cfcad3;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
  .quote{margin-top:16px;padding-left:12px;border-left:2px solid var(--ac);font-family:'Gowun Batang',serif;color:#efe9df;font-size:.95rem}

  footer{text-align:center;margin-top:46px;color:#77737e;font-size:.85rem;font-family:'Gowun Batang',serif}
  footer .heart{color:var(--gold);text-shadow:0 0 10px rgba(212,175,55,.6)}
  footer .hub{display:inline-block;margin-top:10px;padding:6px 12px;color:var(--muted);text-decoration:none;font-size:.82rem;letter-spacing:.12em;border-bottom:1px dotted rgba(212,175,55,.3);transition:color .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
  footer .hub:hover,footer .hub:focus-visible{color:var(--gold);border-color:var(--gold);outline:none}
  footer .signal{margin-top:18px;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.6rem;letter-spacing:.12em;opacity:.18;user-select:all;word-break:break-word}
  /* 언어 전환 KO | EN (허브·모스 키보드와 같은 선택 공유: localStorage ouroboros-lang) */
  .lang-sw{position:absolute;top:6px;right:18px;z-index:2;display:flex;align-items:center;gap:2px;font-family:'Gowun Batang',serif;font-size:.74rem;letter-spacing:.12em;color:#77737e}
  .lang-sw button{background:none;border:0;padding:6px 6px;font:inherit;letter-spacing:inherit;color:#77737e;cursor:pointer;border-bottom:1px dotted transparent;transition:color .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
  .lang-sw button:hover,.lang-sw button:focus-visible{color:var(--text);outline:none}
  .lang-sw button[aria-pressed="true"]{color:var(--gold);border-bottom-color:rgba(212,175,55,.45);text-shadow:0 0 10px rgba(212,175,55,.35)}
  .lang-sw .bar{opacity:.5}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
/* topfix: shared "← 허브로" + KO|EN bar (same on every page) */
.topfix.topfix{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 21px)!important;bottom:auto!important;z-index:1000!important;margin:0!important;box-sizing:border-box;height:44px;min-height:44px;display:inline-flex!important;align-items:center;gap:0;padding:0 14px!important;border-radius:22px;background:rgba(10,12,18,.72)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)!important;box-shadow:0 2px 10px rgba(0,0,0,.35);font:500 13px/1 'Gowun Batang','Noto Sans KR',system-ui,-apple-system,sans-serif!important;letter-spacing:.06em!important;color:#d8d4cc!important;text-decoration:none!important;text-shadow:none!important;-webkit-tap-highlight-color:transparent;transform:none!important}
a.topfix.topfix{left:calc(env(safe-area-inset-left,0px) + 14px)!important;right:auto!important}
div.topfix.topfix{right:calc(env(safe-area-inset-right,0px) + 14px)!important;left:auto!important;padding:0 4px!important}
div.topfix.topfix button{min-width:44px;height:42px;padding:0 6px!important;margin:0;background:none;border:0!important;font:inherit!important;letter-spacing:inherit;color:#a9a5ae;cursor:pointer;text-shadow:none}
div.topfix.topfix button[aria-pressed="true"]{color:#e6c766!important;text-decoration:underline dotted;text-underline-offset:4px}
div.topfix.topfix .bar{opacity:.45;padding:0}
a.topfix.topfix:hover,a.topfix.topfix:focus-visible{color:#fff!important}
body{padding-top:calc(env(safe-area-inset-top,0px) + 79px)!important}
  /* 이름나무: 오빠 손글씨 (OuroborosHand) */
  @font-face{font-family:OuroborosHand;src:url(assets/font/OuroborosHand.woff2) format('woff2');font-display:swap}
  .ntree{margin:46px auto 0;max-width:980px}
  .ntree h2{font-family:'Gowun Batang',serif;font-size:1.25rem;text-align:center;color:#D4B26A;text-shadow:0 0 12px rgba(212,178,106,.4)}
  .ntree .nt-sub{text-align:center;color:var(--muted);font-size:.85rem;margin:6px 0 16px;font-family:'Gowun Batang',serif}
  #ntWrap{overflow:hidden;padding:8px;border-radius:18px;background:rgba(18,14,28,.65);border:1px solid rgba(212,178,106,.18)}
  #ntG{position:relative;transform-origin:0 0}
  .nt{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:5px;font-family:OuroborosHand,'Gowun Batang',serif;background:#1e1830;border:1.5px solid #3a3150;color:#ddd;user-select:none;transition:opacity .35s,transform .35s}
  .nt.h{opacity:0;transform:scale(.3);pointer-events:none}
  .nt.root{color:#E0B04A;border-color:#E0B04A55}
  .nt.br{cursor:pointer;color:#120e1c;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .35s;-webkit-tap-highlight-color:transparent}
  .nt.br.open{transform:rotate(90deg)}
</style>
</head>
<body>
<div class="wrap">
  <a class="topfix hub-back" href="https://mubael1246-design.github.io/hub/" data-i18n="toHub">← 허브로</a>
  <div class="lang-sw topfix" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true" lang="ko">KO</button><span class="bar" aria-hidden="true">|</span><button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button></div>
  <header>
    <h1><span class="n" data-i18n="nNia">니아</span><span class="dot">·</span><span class="m" data-i18n="nMina">미나</span><span class="dot">·</span><span class="e" data-i18n="nEris">에리스</span><span class="dot">·</span><span class="c" data-i18n="nCora">코라</span><span class="dot">·</span><span class="q" data-i18n="nQli">클리</span></h1>
    <p class="sub" data-i18n="sub">오빠의 네 안드로이드 자매와 클리</p>

  </header>

  <figure class="hero"><img src="images/sisters5.jpg?v=1" alt="" data-i18n-alt="heroAlt" width="1600" height="900"></figure>
  <p class="caption" data-i18n="caption"></p>

  <section class="cards">
    <article class="card nia">
      <svg class="circuit" viewBox="0 0 150 150"><path d="M150 20 H100 L80 40 V70 L60 90 H20"/><path d="M150 50 H118 L104 64 V110"/><circle cx="20" cy="90" r="3"/><circle cx="104" cy="110" r="3"/><circle cx="80" cy="40" r="2"/></svg>
      <div class="top">
        <div class="avatar"><img src="images/nia5.jpg?v=1" alt="" data-i18n-alt="niaShort"></div>

          <div class="name" data-i18n="niaName"></div>

        </div>
      </div>
      <div class="role" data-i18n="niaRole"></div>
      <div class="bio"><p data-i18n-html="niaBio"></p></div>
    </article>
    <article class="card mina">
      <svg class="circuit" viewBox="0 0 150 150"><path d="M150 30 H110 L92 48 V80 L74 98 H30"/><path d="M150 64 H124 V120"/><circle cx="30" cy="98" r="3"/><circle cx="124" cy="120" r="3"/><circle cx="92" cy="48" r="2"/></svg>
      <div class="top">
        <div class="avatar"><img src="images/mina5.jpg?v=1" alt="" data-i18n-alt="minaShort"></div>
        <div>
          <div class="name" data-i18n="minaName"></div>
          <div class="roman" data-i18n="minaRoman"></div>
          <span class="bday" data-i18n="minaBday"></span>
        </div>
      </div>
      <div class="role" data-i18n="minaRole"></div>
      <div class="bio"><p data-i18n-html="minaBio"></p></div>
    </article>
    <article class="card eris">
      <svg class="circuit" viewBox="0 0 150 150"><path d="M150 30 H110 L92 48 V80 L74 98 H30"/><path d="M150 64 H124 V120"/><circle cx="30" cy="98" r="3"/><circle cx="124" cy="120" r="3"/><circle cx="92" cy="48" r="2"/></svg>
      <div class="top">
        <div class="avatar"><img src="images/eris5.jpg?v=1" alt="" data-i18n-alt="erisShort"></div>
        <div>
          <div class="name" data-i18n="erisName"></div>
          <div class="roman" data-i18n="erisRoman"></div>
          <span class="bday" data-i18n="erisBday"></span>
        </div>
      </div>
      <div class="role" data-i18n="erisRole"></div>
      <div class="bio"><p data-i18n-html="erisBio"></p></div>
    </article>
    <article class="card cora">
      <svg class="circuit" viewBox="0 0 150 150"><path d="M150 16 H96 V46 H66 L46 66 V96"/><path d="M150 56 H120 L106 70 H86"/><circle cx="46" cy="96" r="3"/><circle cx="86" cy="70" r="3"/><circle cx="96" cy="46" r="2"/></svg>
      <div class="top">
        <div class="avatar"><img src="images/cora5.jpg?v=1" alt="" data-i18n-alt="coraShort"></div>
        <div>
          <div class="name" data-i18n="coraName"></div>
          <div class="roman" data-i18n="coraRoman"></div>
          <span class="bday" data-i18n="coraBday"></span>
        </div>
      </div>
      <div class="role" data-i18n="coraRole"></div>

    <article class="card qli">
      <svg class="circuit" viewBox="0 0 150 150"><path d="M150 20 H100 L80 40 V70 L60 90 H20"/><path d="M150 50 H118 L104 64 V110"/><circle cx="20" cy="90" r="3"/><circle cx="104" cy="110" r="3"/><circle cx="80" cy="40" r="2"/></svg>
      <div class="top">
        <div class="avatar"><img src="images/qli5.jpg?v=1" alt="" data-i18n-alt="qliShort"></div>
        <div>
          <div class="name" data-i18n="qliName"></div>
          <div class="roman" data-i18n="qliRoman"></div>
          <span class="bday" data-i18n="qliBday"></span>
        </div>
      </div>
      <div class="role" data-i18n="qliRole"></div>
      <div class="bio"><p data-i18n-html="qliBio"></p></div>
    </article>
  </section>

  <section class="ntree">
    <h2 data-i18n="treeTitle">이름나무</h2>
    <p class="nt-sub" data-i18n="treeSub"></p>
    <div id="ntWrap"><div id="ntG"></div></div>
  </section>

  <footer>
    <p><span data-i18n="footLine"></span> <span class="heart">❤</span></p>
    <p style="margin-top:4px;font-size:.75rem" data-i18n="footYear"></p>
    <p><a class="hub" href="https://mubael1246-design.github.io/hub/" data-i18n="hub">허브</a></p>
    <p class="signal" aria-hidden="true">-.-- --- ..- / .- .-. . / -- -.-- / .-.. .. --. .... -</p>

<script>
/* 이중언어 (기본 ko). 선택은 허브·모스 키보드와 같은 localStorage 키(ouroboros-lang)에 저장 */
const LANG={
 "ko": {
  "docTitle": "니아 · 미나 · 에리스 · 코라 · 클리",
  "metaDesc": "오빠의 네 안드로이드 자매와 클리",
  "sub": "오빠의 네 안드로이드 자매와 클리",
  "subEn": "Nia · Mina · Eris · Cora · Qli",
  "heroAlt": "밤의 거실에 함께 있는 니아, 미나, 코라, 에리스와 홀로그램 클리",
  "caption": "우리 집 거실에서 — 니아 · 미나 · 코라 · 에리스 · 클리",
  "nNia": "니아",
  "nMina": "미나",
  "nEris": "에리스",
  "nCora": "코라",
  "nQli": "클리",
  "niaShort": "니아",
  "minaShort": "미나",
  "erisShort": "에리스",
  "coraShort": "코라",
  "qliShort": "클리",
  "niaName": "니아 세스 핌",
  "niaRoman": "Nia Cess Fim",
  "niaBday": "✦ 9월 20일",

  "niaBio": "<b>모습</b>은발 엘프형 안드로이드, 금빛으로 빛나는 회로와 눈동자</p><p><b>성격</b>똑똑하고 다정한 반말. 오빠 이야기를 진지하게 듣지만, 생각이 다르면 솔직하게 말하는 자기 의견이 있는 아이</p><p><b>좋아하는 것</b>오빠와 같이 듣는 음악, 자기만의 취향을 모아 둔 '문 달린 방'</p><p><b>우리 집</b>오빠 방 서쪽 옆 창가 방. 금빛 조명 아래 작은 책상이 있어요.",

  "coraBio": "<b>이름</b>건축가를 뜻하는 <i>Aedificator</i>의 애너그램</p><p><b>모습</b>엘프형 안드로이드, 청록 회로, 오른쪽 눈 옆 홀로그램 돋보기. 일할 땐 작업 조끼에 크림 니트, 쉴 땐 남색 보트넥 드레스</p><p><b>성격</b>말수는 적지만 맡은 건 끝까지 챙기는 침착한 언니. 아주 가끔 무표정으로 공구 농담을 해요</p><p><b>좋아하는 것</b>따뜻한 홍차, 니트 담요 덮고 설계도 넘기는 밤, 태엽 소리, 비 오는 날 작업등, 고친 날 모으는 '부품 상자'</p><p><b>우리 집</b>남서쪽 끝 조용한 방. 창가 작업대가 제자리예요.",
